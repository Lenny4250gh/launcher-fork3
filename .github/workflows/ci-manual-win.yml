name: ci-manual-win

# Solo avvio manuale (scheda Actions -> ci -> Run workflow). Nessun trigger su push o pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The online crates come from anyplaynet/network, checked out beside the launcher at the commit in
# network.ref (one full SHA).
defaults:
  run:
    working-directory: launcher

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: launcher
      - id: network-pin
        name: Read the pinned network revision
        shell: bash
        run: |
          ref=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/launcher/network.ref")
          [[ $ref =~ ^[0-9a-f]{40}$ ]] || { echo "network.ref must hold one full commit SHA" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplaynet/network
          ref: ${{ steps.network-pin.outputs.ref }}
          path: network
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher
      - name: Release build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anyplay-launcher-windows-x64
          path: launcher/target/x86_64-pc-windows-msvc/release/anyplay-launcher.exe
          if-no-files-found: error
