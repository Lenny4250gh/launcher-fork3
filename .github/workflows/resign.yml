name: resign

# A signed manifest expires after 30 days (docs/UPDATES.md), and launchers refuse an expired one,
# so a quiet month would end the update channel. Every Monday this signs the latest release's
# manifest again with a fresh `published` and `expires` and replaces the two assets. The
# release, its version and its files do not change.
#
# By hand it is also the kill switch (docs/UPDATES.md, "The kill switch", docs/adr/0002): the
# inputs yank a version, take a yank back, lower or raise the rollout, or offer an earlier release
# again, and the result is signed and published as the manifest of the latest release in two to
# three minutes, with no launcher build (compiling the small signing tool is most of it). The
# policy is carried by the signed manifest itself: every run, the
# weekly one included, starts from the manifest that is live, so a yank survives the renewal.
#
# The secret is in the Environment "release-resigning", which the operator restricts to the
# branch main (docs/UPDATES.md). It is a second environment because the one of the releases
# is restricted to tags and to reviewers, and a weekly run must not wait for a person. As in
# release.yml, only the step that signs has the secret, and the tool is built in a job before.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      yank:
        description: "Versions to yank, comma separated, e.g. 0.3.9. Launchers on one are offered the live version even when it is older."
        required: false
        default: ""
      unyank:
        description: "Versions to take off the yanked list again."
        required: false
        default: ""
      rollout_percent:
        description: "Share of installs that see the update, 0 to 100. Empty keeps the current value; 100 ends the rollout."
        required: false
        default: ""
      offer_tag:
        description: "Offer the files of this earlier release instead, e.g. v0.3.8 (the walk back). Empty keeps the live version."
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0

jobs:
  # No secret. Finds the latest release, builds the signing tool from that release's source, and
  # makes the new manifest for its exe.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      go: ${{ steps.latest.outputs.go }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The latest release
        id: latest
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName || true)
          if [ -z "$tag" ]; then echo "No release yet."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx latest.json; then
            echo "$tag has no signed manifest: nothing to renew."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.go == 'true'
        with:
          persist-credentials: false
          path: launcher
      # Only to satisfy the workspace, which names ../network by path. The tool is built from this
      # workflow's own commit, so the pin is the one of that commit.
      - id: network-pin
        name: Network revision
        if: steps.latest.outputs.go == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NETWORK_OVERRIDE: ${{ vars.NETWORK_REF }}
        run: |
          ref=${NETWORK_OVERRIDE:-$(gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/network.ref" | tr -d '[:space:]')}
          [[ $ref =~ ^[0-9a-f]{40}$ ]] || { echo "the network revision must be one full commit SHA, got '$ref'" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.go == 'true'
        with:
          persist-credentials: false
          repository: anyplaynet/network
          ref: ${{ steps.network-pin.outputs.ref }}
          path: network
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.latest.outputs.go == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build update-sign and make the next manifest
        if: steps.latest.outputs.go == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          MINIMUM_VERSION: ${{ vars.UPDATE_MINIMUM_VERSION || '0.1.0' }}
          # Inputs reach the shell only as environment variables, never spliced into the script.
          IN_YANK: ${{ inputs.yank }}
          IN_UNYANK: ${{ inputs.unyank }}
          IN_ROLLOUT: ${{ inputs.rollout_percent }}
          IN_OFFER_TAG: ${{ inputs.offer_tag }}
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path launcher/Cargo.toml -p anyplay-update-manifest --bin update-sign
          mkdir -p out live
          # The manifest that is live now supplies the files and the policy. The tool checks its
          # signature against the key list, but not the clock (renewing an expired one is the point).
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --pattern latest.json.sig --dir live
          args=(--from live/latest.json --sig live/latest.json.sig --keys launcher/data/update-keys.txt --minimum "$MINIMUM_VERSION" --days 30)
          if [ -n "$IN_OFFER_TAG" ]; then
            re='^v[0-9]+[.][0-9]+[.][0-9]+$'
            [[ $IN_OFFER_TAG =~ $re ]] || { echo "::error::offer_tag must look like v0.3.8"; exit 1; }
            mkdir -p offer
            gh release download "$IN_OFFER_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --pattern latest.json.sig --dir offer
            args+=(--offer-from offer/latest.json --offer-sig offer/latest.json.sig)
          fi
          [ -z "$IN_YANK" ] || args+=(--yank "$IN_YANK")
          [ -z "$IN_UNYANK" ] || args+=(--unyank "$IN_UNYANK")
          [ -z "$IN_ROLLOUT" ] || args+=(--rollout "$IN_ROLLOUT")
          # The renewal applies today's policy to the latest release, so the file comes from the
          # default branch, not from the release's tag. Only "no such file" means "off": any other
          # failure stops the run, because a renewal that quietly dropped the field would let a
          # retired version go online again until the next one.
          if body=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/MIN_SUPPORTED_VERSION" 2> out/supported.err); then
            printf '%s\n' "$body" > out/MIN_SUPPORTED_VERSION
          elif grep -q 'HTTP 404' out/supported.err; then
            : > out/MIN_SUPPORTED_VERSION
          else
            cat out/supported.err >&2
            exit 1
          fi
          rm -f out/supported.err
          launcher/target/release/update-sign reissue "${args[@]}" --supported-file out/MIN_SUPPORTED_VERSION --out out/latest.json
          cp launcher/target/release/update-sign out/update-sign
          cp launcher/data/update-keys.txt out/update-keys.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.latest.outputs.go == 'true'
        with:
          name: resign-input
          path: out/*
          if-no-files-found: error

  sign:
    needs: prepare
    if: needs.prepare.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment: release-resigning
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resign-input
          path: out
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          chmod +x out/update-sign
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::the latest release has a signed manifest but the secret UPDATE_SIGNING_KEY is not set in the environment release-resigning"
            exit 1
          fi
          out/update-sign sign --manifest out/latest.json --out out/latest.json.sig --key-env UPDATE_SIGNING_KEY
      - name: Verify against the trusted keys
        run: out/update-sign verify --manifest out/latest.json --sig out/latest.json.sig --keys out/update-keys.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resigned-manifest
          path: |
            out/latest.json
            out/latest.json.sig
          if-no-files-found: error

  replace:
    needs: [prepare, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write # replaces two assets of a release
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resigned-manifest
          path: out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/latest.json
            out/latest.json.sig
      - name: Replace the two assets
        run: gh release upload "$TAG" out/latest.json out/latest.json.sig --clobber --repo "$GITHUB_REPOSITORY"
